spring.application.name=poke-service
# Configuration of MongoDB
spring.data.mongodb.uri=mongodb://admin:adminpassword@localhost:27017/pokemon_db?authSource=admin

# Configuration of MySQL / JPA
spring.datasource.url=jdbc:mysql://localhost:3306/pokeservice_db?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=poke_user
spring.datasource.password=poke_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuration of Hibernate (Creates the MySQL tables automatically)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true